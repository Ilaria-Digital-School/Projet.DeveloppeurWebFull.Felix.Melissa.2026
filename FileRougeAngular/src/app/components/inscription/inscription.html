<main>
        <section>
            <!-- Formulaire -->
            <div class="mb-3" cl="">
                  <div class="inscription-container">
                <form id="inscription-form" classe="formulaire">
                    <h2> Inscription</h2>
                    <fieldset class="inscription-fieldset">
                        <legend>Informations personnelles</legend>
                        <div>
                            <label for="Nom">Nom :</label>
                            <input type="text" name=" nom" id="nom" placeholder="Votre nom" required="">
                        </div>
                        <div> <label for="email">Email :</label>
                            <input type="email" id="email" placeholder="Exemple@gmail.com" required="">
                        </div>
                        <div class="form-group"> <label for="mdp">Mot de passe : </label>
                            <input type="password" id="mdp" placeholder="Votre mot de passe" required="">
                        </div>
                    </fieldset>
        
        
                    <fieldset class="inscription-fieldset">
                        <legend>Informations supplémentaires</legend>
                        <!-- Radio -->
                        <div>
                            <label>Genre :</label>
                            <input type="radio" id="femme" name="genre" value="femme">
                            <label for="femme">Femme</label>
                            <input type="radio" id="homme" name="genre" value="homme">
                            <label for="homme">Homme</label>
                        </div>
        
        
                        <!-- Pays -->
                        <div>
                            <label for="pays">Pays :</label>
                            <select name="pays" id="pays">
                                <option value="France">France</option>
                                <option value="Espagne">Espagne</option>
                                <option value="Angleterre">Angleterre</option>
                                <option value="Autre">Autre</option>
                            </select>
                        </div>
                    </fieldset>
                    <button type="submit">S'inscrire</button>
                    <p> Vous avez déja un compte ? <a href="./connexion.html">se connecter</a> </p>
                </form>
            </div>
        </div>
        </section>
    </main>
